[project]
name = "yt-doc-agent"
version = "0.1.0"
description = "Generate detailed technical documentation from YouTube videos using LangChain, LangGraph, and Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM & Orchestration
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    # YouTube & Media
    "youtube-transcript-api>=0.6.2",
    "yt-dlp>=2024.1.1",
    "faster-whisper>=1.0.0",
    # Document Fetching
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pymupdf>=1.24.0",
    # Google APIs
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.1.0",
    # Notion
    "notion-client>=2.2.1",
    # Language
    "langdetect>=1.0.9",
    "deep-translator>=1.11.4",
    # Core Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "tiktoken>=0.7.0",
    "loguru>=0.7.0",
    "graphifyy>=0.8.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
yt-doc-agent = "yt_doc_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_doc_agent"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
